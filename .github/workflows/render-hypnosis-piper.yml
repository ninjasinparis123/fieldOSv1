name: Render Piper German Hypnosis

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/render-hypnosis-piper.yml'
      - 'tools/render_piper_hypnosis.sh'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Piper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install piper-tts
          python -m piper.download_voices de_DE-thorsten-high
      - name: Render neural German hypnosis
        run: bash tools/render_piper_hypnosis.sh
      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: hypnosis-piper-german-human
          path: hypnosis_build/Hypnose_Dunkelheit_zu_Licht_MENSCHLICH_Piper.mp3
          if-no-files-found: error
          retention-days: 7
