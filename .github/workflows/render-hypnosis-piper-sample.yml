name: Render Piper Hypnosis Sample

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/render-hypnosis-piper-sample.yml'
      - 'tools/render_piper_sample.sh'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Piper and voice
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install piper-tts
          python -m piper.download_voices de_DE-thorsten-high
      - name: Render sample
        run: bash tools/render_piper_sample.sh
      - name: Upload MP3
        uses: actions/upload-artifact@v4
        with:
          name: hypnosis-human-voice-sample
          path: hypnosis_build/Hypnose_MENSCHLICHE_STIMME_SAMPLE.mp3
          if-no-files-found: error
          retention-days: 7
